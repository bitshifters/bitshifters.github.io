# AI-assisted game ports, remasters and new games for the BBC Micro, shown on /ports.html.
#
# One entry per disc; newest `added` first on the page. Only `name` is needed,
# leave out anything not known.
#
#   name:    game name
#   author:  who did the port (forum handle in brackets if useful)
#   from:    platform it was ported from (BBC Micro for a remaster)
#   kind:    port (default), remaster or original (shown as a tag)
#   status:  shown as a tag, e.g. WIP; leave out once released
#   target:  what it needs, as shown on the page
#   ssd:     disc image URL (absolute, or /content/... for our own)
#   model:   jsbeeb model for the Play link (default Master; B-DFS1.2 for a Model B)
#   emulate: full Play link, overriding the one built from ssd + model (for
#            extra jsbeeb options such as &coProcessor=true or &displayMode=pal)
#   source:  repository URL
#   thread:  Stardot (or other) thread URL
#   page:    page about it (our prod page); the name links here, else to
#            the thread, else to the source
#   thumb:   thumbnail image path or URL, ideally 4:3 (ours are 320x240 jsbeeb
#            captures in /content/ports/)
#   added:   date first released, YYYY-MM-DD
#   notes:   one short line
#
# Play is shown only where the emulator can fetch the disc cross-site: our own
# /content/ files, *.github.io and raw.githubusercontent.com. Stardot
# attachments don't allow it, so those get a download link only, unless
# `emulate:` is given.

