<head>

    <!-- GoatCounter: page views, plus disc downloads and emulator Play clicks as
         events (stats at https://bitshifters.goatcounter.com). No cookies. -->
    <script data-goatcounter="https://bitshifters.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
    <script>
    (function () {
        var DISC = /\.(ssd|dsd|adl|adf|uef|zip|rom|arc)$/i;
        var EMU = /^(bbc\.xania\.org|archi\.medes\.live|(www\.)?bbcmicro\.co\.uk)$/i;
        function file(p) { try { return decodeURIComponent(p.split('/').pop()); } catch (e) { return p; } }
        function track(e) {
            var a = e.target.closest && e.target.closest('a[href]');
            if (!a || !window.goatcounter || !window.goatcounter.count) return;
            var u; try { u = new URL(a.href, location.href); } catch (err) { return; }
            var kind, what;
            if (EMU.test(u.hostname) && (u.search || u.hash)) {
                kind = 'play';
                var d = u.searchParams.get('disc') || u.searchParams.get('disc1') || (u.hash.match(/disc=([^&]+)/) || [])[1];
                what = d ? file(d.split('?')[0]) : u.hostname;
            } else if (DISC.test(u.pathname) || /\/download\/file\.php$/.test(u.pathname) || /\/releases\/download\//.test(u.pathname)) {
                kind = 'download';
                what = /file\.php$/.test(u.pathname) ? 'stardot-' + u.searchParams.get('id') : file(u.pathname);
            } else return;
            var row = a.closest('[data-gc]');
            var name = row ? row.getAttribute('data-gc') : what;
            window.goatcounter.count({ path: kind + ': ' + name, title: what + ' (' + location.pathname + ')', event: true });
        }
        document.addEventListener('click', track);
        document.addEventListener('auxclick', function (e) { if (e.button === 1) track(e); });
    })();
    </script>


    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
    <meta name="viewport" content="width=device-width">
    <meta name="description" content="{{ site.description }}">
    {% if site.meta_author %}<meta name="author" content="{{ site.meta_author }}">{% endif %}

    <!-- fb meta tags -->
    <meta property="og:url"                content="{{ page.url | replace:'index.html','' | prepend: site.url }}" />
    <meta property="og:type"               content="article" />
    <meta property="og:title"              content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}{% if page.team %}, by {{ page.team }}{% endif %}" />
    <meta property="og:description"        content="{{ site.description }}" />
    <meta property="og:image"              content="{% if page.img %}{{ site.url }}/content/{{ page.img }}{% else %}/img/bitshifters.png{% endif %}" />
    <meta property="og:image:secure_url"   content="{% if page.img %}{{ site.url }}/content/{{ page.img }}{% else %}/img/bitshifters.png{% endif %}" />



    <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.url }}">
    <link rel="alternate" type="application/rss+xml" title="RSS" href="/feed.xml">

    <!-- Custom CSS & Bootstrap Core CSS - Uses Bootswatch Flatly Theme: http://bootswatch.com/flatly/ -->
    <link rel="stylesheet" href="{{ "/style.css" }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/MaterialDesign-Webfont/5.3.45/css/materialdesignicons.css" integrity="sha256-NAxhqDvtY0l4xn+YVa6WjAcmd94NNfttjNsDmNatFVc=" crossorigin="anonymous" />

    <!-- Google verification -->
    {% if site.google_verify %}<meta name="google-site-verification" content="{{ site.google_verify }}">{% endif %}

    <!-- Bing Verification -->
    {% if site.bing_verify %}<meta name="msvalidate.01" content="{{ site.bing_verify }}">{% endif %}

    <!-- Custom Fonts -->
    <link rel="stylesheet" href="{{ "/css/font-awesome/css/font-awesome.min.css" }}">
    <link href="//fonts.googleapis.com/css?family=Montserrat:400,700" rel="stylesheet" type="text/css">
    <link href="//fonts.googleapis.com/css?family=Lato:400,700,400italic,700italic" rel="stylesheet" type="text/css">

    <!-- HTML5 Shim and Respond.js IE8 support of HTML5 elements and media queries -->
    <!-- WARNING: Respond.js doesn't work if you view the page via file:// -->
    <!--[if lt IE 9]>
        <script src="https://oss.maxcdn.com/libs/html5shiv/3.7.0/html5shiv.js"></script>
        <script src="https://oss.maxcdn.com/libs/respond.js/1.4.2/respond.min.js"></script>
    <![endif]-->



</head>
